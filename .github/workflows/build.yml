name: Build and refresh RuleHelper Donator 2.1
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Donator Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.3'
            java: '25'
          - minecraft: '1.21.11'
            java: '21'
          - minecraft: '1.21.4'
            java: '21'
    steps:
      - uses: actions/checkout@v4
      - name: Check public donor-only source tree
        run: test ! -d moderator
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run regression checks
        working-directory: versions/${{ matrix.minecraft }}
        run: ./gradlew --no-daemon clean build
      - name: Verify donor identity and stage release JAR
        shell: bash
        working-directory: versions/${{ matrix.minecraft }}
        run: |
          source_jar="build/libs/RuleHelper-${{ matrix.minecraft }}-Fabric-2.1.0.jar"
          python "$GITHUB_WORKSPACE/.github/scripts/verify_donator_jar.py" "$source_jar" '${{ matrix.minecraft }}'
          cp "$source_jar" "$GITHUB_WORKSPACE/RuleHelper-${{ matrix.minecraft }}-Fabric.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: RuleHelper-Donator-2.1.0-${{ matrix.minecraft }}
          path: RuleHelper-${{ matrix.minecraft }}-Fabric.jar
          if-no-files-found: error

  release:
    name: Publish one release with all three donor builds
    needs: build
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[refresh-donator]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RuleHelper-Donator-2.1.0-*
          path: release-assets
          merge-multiple: true
      - name: Verify all three downloaded builds
        run: |
          python .github/scripts/verify_donator_jar.py release-assets/RuleHelper-26.3-Fabric.jar 26.3
          python .github/scripts/verify_donator_jar.py release-assets/RuleHelper-1.21.11-Fabric.jar 1.21.11
          python .github/scripts/verify_donator_jar.py release-assets/RuleHelper-1.21.4-Fabric.jar 1.21.4
      - name: Replace current donor assets in the three existing releases
        uses: actions/github-script@v7
        with:
          script: |
            const refresh = require('./.github/scripts/refresh_donator_releases.js');
            await refresh({github, context, core});
