name: Build RuleHelper

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.11
            project: versions/1.21.11
          - minecraft: 1.21.4
            project: versions/1.21.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        working-directory: ${{ matrix.project }}
        run: ./gradlew --no-daemon clean build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RuleHelper-Minecraft-${{ matrix.minecraft }}
          path: ${{ matrix.project }}/build/libs/*-1.1.0.jar
          if-no-files-found: error
