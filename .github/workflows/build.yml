# Build RuleHelper test artifacts
name: Build RuleHelper

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.11
            project: versions/1.21.11
            artifact: RuleHelper-1.21.11-Fabric.jar
          - minecraft: 1.21.4
            project: versions/1.21.4
            artifact: RuleHelper-1.21.4-Fabric.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        working-directory: ${{ matrix.project }}
        run: ./gradlew --no-daemon clean build
      - name: Stage JAR with release filename
        shell: bash
        working-directory: ${{ matrix.project }}
        run: |
          source_jar="$(find build/libs -maxdepth 1 -type f -name '*-1.1.4.jar' ! -name '*-sources-1.1.4.jar' -print -quit)"
          test -n "$source_jar"
          cp "$source_jar" "$GITHUB_WORKSPACE/${{ matrix.artifact }}"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RuleHelper-Minecraft-${{ matrix.minecraft }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish v1.1.3 release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[publish-release]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both JARs
        uses: actions/download-artifact@v4
        with:
          pattern: RuleHelper-Minecraft-*
          path: release-assets
          merge-multiple: true
      - name: Update existing GitHub Release and upload JARs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag_name = 'v1.1.3';
            const files = [
              'RuleHelper-1.21.11-Fabric.jar',
              'RuleHelper-1.21.4-Fabric.jar',
            ];
            const body = [
              'Fabric-клиентский мод для Minecraft.',
              '',
              '- Minecraft 1.21.11: `RuleHelper-1.21.11-Fabric.jar`',
              '- Minecraft 1.21.4: `RuleHelper-1.21.4-Fabric.jar`',
              '',
              'Исправлено перехватывание кликов по кликабельным компонентам чата: собственные действия элементов, например [Add], сохраняются.',
            ].join('\n');

            let release;
            try {
              const result = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tag_name });
              release = result.data;
              const updated = await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id,
                name: 'RuleHelper v1.1.3',
                body,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              });
              release = updated.data;
            } catch (error) {
              if (error.status !== 404) throw error;
              const result = await github.rest.repos.createRelease({
                owner, repo, tag_name, target_commitish: context.sha,
                name: 'RuleHelper v1.1.3', body,
                draft: false, prerelease: false,
              });
              release = result.data;
            }

            const { data: existingAssets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: release.id, per_page: 100,
            });
            for (const name of files) {
              const filePath = `release-assets/${name}`;
              if (!fs.existsSync(filePath)) throw new Error(`Missing release file: ${filePath}`);
              for (const asset of existingAssets.filter(item => item.name === name)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: {
                  'content-type': 'application/java-archive',
                  'content-length': data.length,
                },
              });
            }
