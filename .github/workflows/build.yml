name: Build and publish RuleHelper Donator 2.0
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Donator Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.3'
            java: '25'
          - minecraft: '1.21.11'
            java: '21'
          - minecraft: '1.21.4'
            java: '21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run regression checks
        working-directory: versions/${{ matrix.minecraft }}
        run: ./gradlew --no-daemon clean build
      - name: Verify donor identity and stage release JAR
        shell: bash
        working-directory: versions/${{ matrix.minecraft }}
        run: |
          source_jar="build/libs/RuleHelper-${{ matrix.minecraft }}-Fabric-2.0.0.jar"
          python "$GITHUB_WORKSPACE/.github/scripts/verify_donator_jar.py" "$source_jar" '${{ matrix.minecraft }}'
          cp "$source_jar" "$GITHUB_WORKSPACE/RuleHelper-${{ matrix.minecraft }}-Fabric.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: RuleHelper-Donator-2.0.0-${{ matrix.minecraft }}
          path: RuleHelper-${{ matrix.minecraft }}-Fabric.jar
          if-no-files-found: error

  release:
    name: Publish one release with all three donor builds
    needs: build
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[publish-major]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RuleHelper-Donator-2.0.0-*
          path: release-assets
          merge-multiple: true
      - name: Verify all three downloaded builds
        run: |
          python .github/scripts/verify_donator_jar.py release-assets/RuleHelper-26.3-Fabric.jar 26.3
          python .github/scripts/verify_donator_jar.py release-assets/RuleHelper-1.21.11-Fabric.jar 1.21.11
          python .github/scripts/verify_donator_jar.py release-assets/RuleHelper-1.21.4-Fabric.jar 1.21.4
      - name: Upload three JARs and publish the major release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = 'v2.0.0';
            const name = 'RuleHelper 2.0 — большое обновление для донатеров';
            const body = fs.readFileSync('RELEASE_NOTES.md', 'utf8');
            const files = ['RuleHelper-26.3-Fabric.jar', 'RuleHelper-1.21.11-Fabric.jar', 'RuleHelper-1.21.4-Fabric.jar'];
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name, body, draft: true, prerelease: false,
              })).data;
            }
            const assets = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: release.id, per_page: 100})).data;
            for (const file of files) {
              for (const asset of assets.filter(item => item.name === file)) {
                await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: asset.id});
              }
              const data = fs.readFileSync(`release-assets/${file}`);
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: file, data,
                headers: {'content-type':'application/java-archive', 'content-length': data.length},
              });
            }
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, name, body,
              draft: false, prerelease: false, make_latest: 'true',
            });
