name: Build moderator ports
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '1.21.4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build moderator mod
        working-directory: moderator/${{ matrix.minecraft }}
        run: ./gradlew --no-daemon clean build
      - uses: actions/upload-artifact@v4
        with:
          name: RuleHelper-Moderators-${{ matrix.minecraft }}
          path: moderator/${{ matrix.minecraft }}/build/libs/*-1.3.6-moderator.jar
          if-no-files-found: error
