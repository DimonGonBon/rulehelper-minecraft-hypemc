name: Publish Minecraft 26.3

on:
  push:
    branches: [main]

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-26.3]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested JAR
        run: |
          echo 'dad022aa9ba75ce28dcc5031ed0328263dc2710515d4f334da2d96399ebc0d1c  artifacts/RuleHelper-26.3-Fabric.jar' | sha256sum --check
          unzip -t artifacts/RuleHelper-26.3-Fabric.jar
      - name: Publish tested Minecraft 26.3 build
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = 'v1.3.3-26.3';
            const body = [
              'RuleHelper 1.3.3 для Minecraft Java Edition 26.3 (Fabric).',
              '',
              '### Обновлено',
              '- Донатерская версия получила обновлённое компактное сине-тёмное меню правил в стиле модерской сборки.',
              '- Префикс RuleHelper в чате открывает меню выбранного игрока; префиксы в объявлениях о наказаниях позволяют скопировать ник выдавшего или получившего игрока.',
              '- Добавлены настраиваемые префиксы меню и уведомлений, звуковые предупреждения об оскорблениях родных и некорректных наказаниях.',
              '- История за день считает найденные в чате объявления о наказаниях, выданных вами в текущую календарную дату; доступна по F9.',
              '- Для разбана и размута режим берётся из объявления о наказании, даже если вы сейчас на другом режиме.',
              '- Сохранены выбор правил и действий, быстрые команды `/dupeip`, `/hist`, `/shist`, `/pex user`, снятие наказания и копирование ника.',
              '- Настройки мода открываются клавишей Home. Донатерские права сохранены: модерские очередь нарушителей и запрос доказательств в этой сборке отсутствуют.',
              '',
              '### Установка и использование',
              'Нужны Minecraft 26.3, Fabric Loader 0.20.1+ и Java 25. Fabric API и дополнительные моды не требуются. Удалите старый RuleHelper из папки `mods`, положите туда `RuleHelper-26.3-Fabric.jar` и запустите профиль Fabric 26.3.',
              'В игре откройте чат и нажмите на префикс RuleHelper перед ником игрока. В меню выберите категорию, правило и действие. Настройте префиксы и горячие клавиши через Home; история наказаний за день — F9. Доступность команд определяется правами сервера.',
              '',
              'Внутренняя версия мода: 1.3.3.',
            ].join('\n');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
              release = (await github.rest.repos.updateRelease({owner, repo, release_id:release.id, name:'RuleHelper — Minecraft 26.3', body, draft:false, prerelease:false, make_latest:'true'})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name:tag, target_commitish:context.sha, name:'RuleHelper — Minecraft 26.3', body, draft:false, prerelease:false, make_latest:'true'})).data;
            }
            const name = 'RuleHelper-26.3-Fabric.jar';
            const data = fs.readFileSync(`artifacts/${name}`);
            const assets = (await github.rest.repos.listReleaseAssets({owner, repo, release_id:release.id, per_page:100})).data;
            for (const asset of assets.filter(a => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id:asset.id});
            }
            await github.rest.repos.uploadReleaseAsset({owner, repo, release_id:release.id, name, data, headers:{'content-type':'application/java-archive', 'content-length':data.length}});
