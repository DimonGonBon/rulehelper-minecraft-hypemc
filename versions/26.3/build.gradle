plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '2.0.0'
group = 'ru.dmitry'

base {
    archivesName = 'RuleHelper-26.3-Fabric'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}


tasks.register('portRegressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.dmitry.rulehelper.chat.PortRegressionTest'
}
check.dependsOn portRegressionTest

tasks.named('test') { failOnNoDiscoveredTests = false }

tasks.register('reasonStyleTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'ru.dmitry.rulehelper.ReasonStyleTest'
}
check.dependsOn reasonStyleTest

tasks.register('punishmentCorrectionTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'ru.dmitry.rulehelper.PunishmentCorrectionTest'
}
check.dependsOn punishmentCorrectionTest

tasks.register('customReasonTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'ru.dmitry.rulehelper.CustomReasonTest'
}
check.dependsOn customReasonTest

tasks.register('donatorScopeTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'ru.dmitry.rulehelper.DonatorScopeTest'
}
check.dependsOn donatorScopeTest
